apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-metrics-proxy-nginx
  namespace: monitoring
data:
  proxy.conf: |
    # scheduler -> https://127.0.0.1:10259/metrics (인증 필요)
    server {
      listen 19159;
      location /metrics {
        proxy_pass https://127.0.0.1:10259/metrics;
        proxy_ssl_verify off;

        proxy_ssl_certificate     /etc/nginx/ssl/apiserver-kubelet-client.crt;
        proxy_ssl_certificate_key /etc/nginx/ssl/apiserver-kubelet-client.key;
      }
    }

    # controller-manager -> https://127.0.0.1:10257/metrics (인증 필요)
    server {
      listen 19157;
      location /metrics {
        proxy_pass https://127.0.0.1:10257/metrics;
        proxy_ssl_verify off;

        proxy_ssl_certificate     /etc/nginx/ssl/apiserver-kubelet-client.crt;
        proxy_ssl_certificate_key /etc/nginx/ssl/apiserver-kubelet-client.key;
      }
    }

    # etcd metrics -> http://127.0.0.1:2381/metrics (대부분 인증 없음)
    server {
      listen 19181;
      location /metrics {
        proxy_pass http://127.0.0.1:2381/metrics;
      }
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: controlplane-metrics-proxy
  namespace: monitoring
  labels:
    app: controlplane-metrics-proxy
spec:
  selector:
    matchLabels:
      app: controlplane-metrics-proxy
  template:
    metadata:
      labels:
        app: controlplane-metrics-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          args: ["nginx","-g","daemon off;"]
          ports:
            - name: sched
              containerPort: 19159
            - name: cm
              containerPort: 19157
            - name: etcd
              containerPort: 19181
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # ★ 컨트롤플레인 노드의 kubeadm 인증서/키를 readOnly 마운트
            - name: kubelet-client-crt
              mountPath: /etc/nginx/ssl/apiserver-kubelet-client.crt
              readOnly: true
            - name: kubelet-client-key
              mountPath: /etc/nginx/ssl/apiserver-kubelet-client.key
              readOnly: true
#          resources:
#            requests:
#              cpu: 10m
#              memory: 32Mi
#            limits:
#              cpu: 200m
#              memory: 128Mi

      volumes:
        - name: nginx-conf
          configMap:
            name: controlplane-metrics-proxy-nginx
            items:
              - key: proxy.conf
                path: proxy.conf

        # hostPath: 파일 단위로만 마운트(전체 pki 디렉토리 마운트보다 안전)
        - name: kubelet-client-crt
          hostPath:
            path: /etc/kubernetes/pki/apiserver-kubelet-client.crt
            type: File
        - name: kubelet-client-key
          hostPath:
            path: /etc/kubernetes/pki/apiserver-kubelet-client.key
            type: File

---
apiVersion: v1
kind: Service
metadata:
  name: controlplane-metrics-proxy
  namespace: monitoring
  labels:
    app: controlplane-metrics-proxy
spec:
  selector:
    app: controlplane-metrics-proxy
  ports:
    - name: sched
      port: 19159
      targetPort: sched
    - name: cm
      port: 19157
      targetPort: cm
    - name: etcd
      port: 19181
      targetPort: etcd

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: controlplane-metrics-proxy
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: controlplane-metrics-proxy
  endpoints:
    - port: sched
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: cm
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: etcd
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

