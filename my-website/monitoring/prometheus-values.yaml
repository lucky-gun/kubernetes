grafana:
  enabled: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  create: true
  keepFiringFor: 10m
  additionalRuleLabels:
    service: infra
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

customRules:
  KubePodCrashLooping:
    for: 30m
  KubeDeploymentReplicasMismatch:
    for: 30m
  NodeFilesystemSpaceFillingUp:
    for: 1h
  CPUThrottlingHigh:
    for: 30m

alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url

    route:
      receiver: "slack-default"
      group_by: ['service','alertname']
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 12h

      routes:
        # --- 소음 방지(강추): Watchdog/InfoInhibitor는 아예 버리기
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
        - receiver: "null"
          matchers:
            - alertname="InfoInhibitor"

        # SecOps는 매우 느슨하게(원하면 repeat을 3d~7d로 더 늘려도 됨)
        - receiver: "slack-once"
          matchers:
            - service="secops"
          group_by: ["service", "alertname"]
          group_wait: 10m
          group_interval: 2h
          repeat_interval: 24h

        # Infra도 여유 있게
        - receiver: "slack-once"
          matchers:
            - service="infra"
          group_by: ["service", "alertname"]
          group_wait: 10m
          group_interval: 2h
          repeat_interval: 24h

    receivers:
      - name: "null"

      - name: "slack-default"
        slack_configs:
          - send_resolved: false
            channel: "skill-up"
            username: "Alert"
            icon_emoji: "⚓"
            text: |-
              [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
              (count={{ len .Alerts }})
              {{- range .Alerts }}
              - {{ .Labels.instance }}: {{ .Annotations.summary }}
              {{- end }}

      - name: "slack-once"
        slack_configs:
          - send_resolved: false
            channel: "skill-up"
            username: "Alert"
            icon_emoji: "⚓"
            text: |-
              [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
              (count={{ len .Alerts }})
              {{- range .Alerts }}
              - {{ .Labels.instance }}: {{ .Annotations.summary }}
              {{- end }}

    inhibit_rules:
      - source_matchers: ['severity="critical"', 'service="infra"']
        target_matchers: ['severity="warning"', 'service="infra"']
        equal: ["instance"]

  alertmanagerSpec:
    replicas: 2

    secrets:
      - alertmanager-slack

    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "rook-ceph-block"
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

prometheus:
  enabled: true
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s

    retention: 30d               
    walCompression: true 
    enableAdminAPI: false

    #additionalArgs:
    #  - name: web.enable-lifecycle

    replicas: 2

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "rook-ceph-block"
          resources:
            requests:
              storage: 8Gi

    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 6Gi

prometheusAdapter:
  enabled: false

