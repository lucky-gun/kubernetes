apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-infra-rules         # 객체 이름
  namespace: monitoring        # 설치된 네임스페이스
  labels:
    # [중요] Prometheus 인스턴스가 이 Rule을 찾을 수 있도록 라벨을 붙여야 합니다.
    # 보통 helm 설치 시 사용한 release 이름이 라벨로 쓰입니다.
    release: prometheus-stack  
spec:
  groups:
    - name: node_resource_alerts
      rules:
        - alert: HighCPUUsage
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 5m
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU usage > 85% for 5m"
