apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap-infra-4
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://github.com/lucky-gun/kubernetes
      targetRevision: main
      path: my-website/gitops/clusters/prod/root/applications/infra
      directory:
        include: '{jenkins.yaml, traefik/traefik.yaml, traefik/traefik-resource.yaml}' 
 syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
