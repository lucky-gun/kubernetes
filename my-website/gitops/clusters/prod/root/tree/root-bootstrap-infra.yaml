apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://github.com/lucky-gun/kubernetes
      targetRevision: main
      path: my-website/gitops/clusters/prod/root/applications/infra
      directory:
        include: '{database/*.yaml,rook-ceph/*.yaml}'
        recurse: true

    - repoURL: https://github.com/lucky-gun/kubernetes
      targetRevision: main
      path: my-website/gitops/clusters/prod/root/projects
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
