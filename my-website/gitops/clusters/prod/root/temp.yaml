spec:
  sources:
    - repoURL: https://helm.mariadb.com/mariadb-operator
      chart: mariadb-operator
      targetRevision: 25.10.4
      helm:
        valueFiles:
          - $values/my-website/gitops/infrastructure/database/galera/values.yaml

    - repoURL: https://github.com/lucky-gun/kubernetes
      targetRevision: main
      ref: values
      path: my-website/gitops/infrastructure/rook-ceph
      kustomize: {}

