apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: security
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  sources:
    - repoURL: https://github.com/lucky-gun/kubernetes
      targetRevision: main
      ref: values
      path: my-website/gitops/infrastructure/security/metadata
    - repoURL: https://crowdsecurity.github.io/helm-charts
      chart: crowdsec
      targetRevision: 0.22.0
      helm:
        valueFiles:
          - $values/my-website/gitops/infrastructure/security/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      #- ServerSideApply=true
