apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps

secretGenerator:
- name: wordpress-db-secrets
  envs:
  - .env

configMapGenerator:
- name: wordpress-config
  literals:
    - db_host=mariadb-galera.database.svc.cluster.local
    - wp_tz=Asia/Seoul

resources:
- wordpress.yaml
- wordpress-auth-sealed-keys.yaml
