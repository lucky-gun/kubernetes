apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-config
  namespace: database
data:
  init.sql: |
    -- Nextcloud
    CREATE DATABASE IF NOT EXISTS `nextcloud_db`
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE USER IF NOT EXISTS 'next_admin'@'%'
      IDENTIFIED BY 'next_pass';

    GRANT ALL PRIVILEGES ON `nextcloud_db`.*
      TO 'next_admin'@'%';

    -- WordPress
    CREATE DATABASE IF NOT EXISTS `wordpress_db`
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE USER IF NOT EXISTS 'wp_admin'@'%'
      IDENTIFIED BY 'wp_pass';

    GRANT ALL PRIVILEGES ON `wordpress_db`.*
      TO 'wp_admin'@'%';

    -- MediaWiki
    CREATE DATABASE IF NOT EXISTS `mediawiki_db`
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE USER IF NOT EXISTS 'wiki_admin'@'%'
      IDENTIFIED BY 'wiki_pass';

    GRANT ALL PRIVILEGES ON `mediawiki_db`.*
      TO 'wiki_admin'@'%';

    -- Grafana
    CREATE DATABASE IF NOT EXISTS `grafana_db`
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE USER IF NOT EXISTS 'gf_admin'@'%'
      IDENTIFIED BY 'gf_pass';

    GRANT ALL PRIVILEGES ON `grafana_db`.*
      TO 'gf_admin'@'%';

    FLUSH PRIVILEGES;
