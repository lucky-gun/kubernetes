deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  rulerConfig:
    enable_api: true
    alertmanager_url : 

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: http://rook-ceph-rgw-rook-store.rook-ceph.svc:80
      region: us-east-1
      accessKeyId: 
      secretAccessKey:
      s3ForcePathStyle: true
      insecure: true

singleBinary:
  replicas: 2
  persistence:
    enabled: true
    storageClass: rook-rbd-sc
    accessModes:
      - ReadWriteOnce
    size: 3Gi

gateway:
  replicas: 1
  enabled: true
  containerPort: 8080
  nginxConfig:
    httpListenPort: 8080
    enableIPv6: false

minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
