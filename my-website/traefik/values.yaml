# ----------------------------------------------------------------
# Traefik Helm Chart Values (Optimized for Cloudflare & DNS Challenge)
# ----------------------------------------------------------------

# 1. Deployment 설정
deployment:
  enabled: true
  replicas: 1
  podSecurityContext:
    fsGroup: 65532
  initContainers:
    - name: acme-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /etc/traefik/letsencrypt/acme.json && chown 65532:65532 /etc/traefik/letsencrypt/acme.json && chmod 600 /etc/traefik/letsencrypt/acme.json"]
      securityContext:
        runAsUser: 0  # chown을 실행하기 위해 root 권한 사용
        runAsNonRoot: false  # <--- 이 줄을 추가하여 root 실행 허용
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: data
          mountPath: /etc/traefik/letsencrypt

# 2. 서비스 포트 및 Cloudflare 신뢰 설정 (핵심)
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    # --- 수정된 부분 ---
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
    # ------------------
    forwardedHeaders:
      trustedIPs: &cloudflare_ips
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
                                                                                                                                                                
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    # HTTP3/QUIC 등을 쓰실 계획이라면 여기에 설정을 추가할 수 있습니다.
    forwardedHeaders:
      trustedIPs: *cloudflare_ips

  metrics:
    port: 9100
    expose:
      default: false

# 3. 로그 설정 (JSON 포맷 유지 및 헤더 보존)
logs:
  general:
    level: INFO
    format: common

  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultMode: drop
        names:
          Cf-Connecting-Ip: keep
          X-Forwarded-For: keep
          User-Agent: keep

# 4. 인증서 자동 갱신을 위한 Persistence (acme.json 저장)
persistence:
  enabled: true
  name: data
  path: /etc/traefik/letsencrypt
  size: 1Gi
  storageClass: "rook-cephfs-sc"
  accessMode: ReadWriteMany  # 사용하는 스토리지 클래스명 확인 필요

# 5. Cloudflare DNS API 인증 설정
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token # 사전에 생성할 Secret 이름
        key: CF_DNS_API_TOKEN

certficatesResolvers:
  myresolver:
    acme:
      email: "fallsky104@gmail.com"
      storage: "/etc/traefik/letsencrypt/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

additionalArguments: []

api:
  dashboard: true
  insecure: false # IngressRoute로 별도 노출 권장

metrics:
  prometheus:
    entryPoint: metrics
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: prometheus-stack
      interval: 30s
      scrapeTimeout: 10s

experimental:
  plugins:
    crowdsec:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.0"
    coraza:
      moduleName: "github.com/jcchavezs/coraza-http-wasm-traefik"
      version: "v0.3.0"

providers:
  kubernetesCRD:
    allowCrossNamespace: true
