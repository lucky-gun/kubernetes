# ----------------------------------------------------------------
# Traefik Helm Chart Values (Optimized for Cloudflare & DNS Challenge)
# ----------------------------------------------------------------

# 1. Deployment 설정
deployment:
  enabled: true
  replicas: 1 # 가용성을 위해 2 이상 권장하나, 테스트 시 1로 시작

# 2. 서비스 포트 및 Cloudflare 신뢰 설정 (핵심)
ports:
  web:
    port: 80
    expose: true
    exposedPort: 80
    forwardedHeaders:
      trustedIPs: &cloudflare_ips
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"

  websecure:
    port: 443
    expose: true
    exposedPort: 443
    forwardedHeaders:
      trustedIPs: *cloudflare_ips

# 3. 로그 설정 (JSON 포맷 유지 및 헤더 보존)
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultMode: drop
        names:
          Cf-Connecting-Ip: keep
          X-Forwarded-For: keep
          User-Agent: keep

# 4. 인증서 자동 갱신을 위한 Persistence (acme.json 저장)
persistence:
  enabled: true
  name: data
  path: /etc/traefik/letsencrypt
  size: 1Gi
  # storageClass: "rook-ceph-block" # 사용하는 스토리지 클래스명 확인 필요

# 5. Cloudflare DNS API 인증 설정
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token # 사전에 생성할 Secret 이름
        key: CF_DNS_API_TOKEN

# 6. Static Config (CertResolvers 등)
additionalArguments:
  - "--certificatesresolvers.myresolver.acme.email=your-email@example.com"
  - "--certificatesresolvers.myresolver.acme.storage=/etc/traefik/letsencrypt/acme.json"
  - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"

# 7. Dashboard 활성화 (Internal 전용으로 권장)
api:
  dashboard: true
  insecure: false # IngressRoute로 별도 노출 권장
