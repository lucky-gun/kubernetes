apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# Secret 자동 생성기
secretGenerator:
- name: nextcloud-secrets
  envs:
  - .env

configMapGenerator:
- name: nextcloud-config
  literals:
    - REDIS_HOST=redis-service.database.svc.cluster.local

# 적용할 리소스들
resources:
- nextcloud.yaml
