# 1. WordPress용
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-shared-pvc
  namespace: infra
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs-sc # 아까 바꾼 이름이 있다면 적용
  resources:
    requests:
      storage: 3Gi
---
# 2. MediaWiki용
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mw-shared-pvc
  namespace: infra
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs-sc
  resources:
    requests:
      storage: 1Gi
---
# 3. Nextcloud용
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nc-shared-pvc
  namespace: infra
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs-sc
  resources:
    requests:
      storage: 3Gi
