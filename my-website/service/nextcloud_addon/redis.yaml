apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis  # 1. 여기에 정의된 라벨이
  template:
    metadata:
      labels:
        app: redis # 2. 여기와 일치해야 하고
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server"]
        args:
          - "--requirepass"
          - "redis_pass"
          - "--maxmemory"
          - "256mb"
          - "--maxmemory-policy"
          - "allkeys-lru"
          - "--save"
          - "60"
          - "1000"
        resources:
          limits:
            memory: "300Mi"
            cpu: "500m"
          requests:
            memory: "256Mi" # Request도 설정하는 것을 권장합니다.
            cpu: "100m"
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: database
spec:
  selector:
    app: redis # 3. 서비스가 이 라벨을 찾아갈 수 있게 됩니다.
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
