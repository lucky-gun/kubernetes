apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # ACME 서버 URL (Let's Encrypt의 프로덕션 환경)
    server: https://acme-v02.api.letsencrypt.org/directory
    email: fallsky104@gmail.com  # 인증서 발급을 위한 이메일 주소
    privateKeySecretRef:
      name: letsencrypt-prod-key  # 발급된 인증서의 키가 저장될 Secret 이름
    solvers:
      - http01:
          ingress:
            class: project2  # Ingress controller로 nginx 사용

