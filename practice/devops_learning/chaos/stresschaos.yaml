apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: frontend-stress
  namespace: default
spec:
  mode: one

  selector:
    namespaces:
      - default
    labelSelectors:
      app.kubernetes.io/name: frontend-podinfo

  stressors:
    cpu:
      workers: 2
      load: 80

    memory:
      workers: 1
      size: "512MB"

  duration: "2m"
