config:
  clientID: kong
  clientSecret: <client_secret>
  cookieSecret: <random hex>

extraEnv:
  - name: OAUTH2_PROXY_REDIS_CONNECTION_URL
    valueFrom:
      secretKeyRef:
        name: oauth2-proxy-redis
        key: redis-url

extraArgs:
  provider: keycloak-oidc
  oidc-issuer-url: https://keycloak.lucky-gun.com/realms/devops
  redirect-url: https://boutique.lucky-gun.com/oauth2/callback
  email-domain: "*"
  cookie-secure: "true"
  cookie-samesite: lax
  reverse-proxy: "true"
  http-address: "0.0.0.0:4180"
  session-store-type: redis
  upstream: http://rbac-demo.boutique.svc.cluster.local:80
  set-xauthrequest: "true"
  pass-access-token: "true"
  pass-user-headers: "true"
#  allowed-group: admin


