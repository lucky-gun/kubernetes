server:
  retention: 15d
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: managed-nfs-storage
  service:
    type: ClusterIP
  extraFlags:
    - web.enable-remote-write-receiver

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
