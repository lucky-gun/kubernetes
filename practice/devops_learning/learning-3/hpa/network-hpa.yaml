apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-podinfo-network-rx

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-podinfo

  minReplicas: 2
  maxReplicas: 10

  metrics:
  - type: Pods
    pods:
      metric:
        name: network_receive_bytes
      target:
        type: AverageValue
        averageValue: "500000"

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0

      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300

      policies:
      - type: Percent
        value: 20
        periodSeconds: 60

      selectPolicy: Max

