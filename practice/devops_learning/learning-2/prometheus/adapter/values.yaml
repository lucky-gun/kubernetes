prometheus:
  url: http://prometheus-server.monitoring.svc.cluster.local
  port: 80

rules:
  custom:
    - seriesQuery: 'http_requests_total'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)_total"
        as: "${1}"
      metricsQuery: |
        sum(rate(http_requests_total{<<.LabelMatchers>>}[2m]))
        by (<<.GroupBy>>)
